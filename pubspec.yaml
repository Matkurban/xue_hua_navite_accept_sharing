name: xue_hua_navite_accept_sharing
description: "A cross-platform Flutter plugin for native drag-and-drop and file sharing across macOS, Windows, Linux, iOS, Android, and Web."
version: 1.0.0
homepage: https://github.com/Matkurban/xue_hua_navite_accept_sharing
repository: https://github.com/Matkurban/xue_hua_navite_accept_sharing
issue_tracker: https://github.com/Matkurban/xue_hua_navite_accept_sharing/issues
topics:
  - drag-and-drop
  - sharing
  - file-transfer
  - desktop
  - multiplatform

environment:
  sdk: ^3.13.5
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.1.1
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # This section identifies this Flutter project as a plugin project.
  # The 'pluginClass' specifies the class (in Java, Kotlin, Swift, Objective-C, etc.)
  # which should be registered in the plugin registry. This is required for
  # using method channels.
  # The Android 'package' specifies package in which the registered class is.
  # This is required for using method channels on Android.
  # The 'ffiPlugin' specifies that native code should be built and bundled.
  # This is required for using `dart:ffi`.
  # All these are used by the tooling to maintain consistency when
  # adding or updating assets for this project.
  plugin:
    platforms:
      android:
        package: com.kurban.xue_hua_navite_accept_sharing
        pluginClass: XueHuaNaviteAcceptSharingPlugin
      ios:
        pluginClass: XueHuaNaviteAcceptSharingPlugin
      linux:
        pluginClass: XueHuaNaviteAcceptSharingPlugin
      macos:
        pluginClass: XueHuaNaviteAcceptSharingPlugin
      windows:
        pluginClass: XueHuaNaviteAcceptSharingPluginCApi
      web:
        pluginClass: XueHuaNaviteAcceptSharingWeb
        fileName: xue_hua_navite_accept_sharing_web.dart