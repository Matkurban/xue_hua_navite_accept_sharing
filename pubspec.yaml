name: xue_hua_navite_accept_sharing
description: "A cross-platform Flutter plugin for receiving shared text, URLs, images, videos, and arbitrary files across Android, iOS, macOS, Windows, Linux, and Web."
version: 1.0.8
homepage: https://github.com/Matkurban/xue_hua_navite_accept_sharing
repository: https://github.com/Matkurban/xue_hua_navite_accept_sharing
issue_tracker: https://github.com/Matkurban/xue_hua_navite_accept_sharing/issues
documentation: https://github.com/Matkurban/xue_hua_navite_accept_sharing#readme
topics:
  - sharing
  - share-extension
  - share-target
  - file-sharing
  - multiplatform

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.1.1
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.kurban.xue_hua_navite_accept_sharing
        pluginClass: XueHuaNaviteAcceptSharingPlugin
      ios:
        pluginClass: XueHuaNaviteAcceptSharingPlugin
      linux:
        pluginClass: XueHuaNaviteAcceptSharingPlugin
      macos:
        pluginClass: XueHuaNaviteAcceptSharingPlugin
      windows:
        pluginClass: XueHuaNaviteAcceptSharingPluginCApi
      web:
        pluginClass: XueHuaNaviteAcceptSharingWeb
        fileName: xue_hua_navite_accept_sharing_web.dart
